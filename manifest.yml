modules:
  jira:globalPage:
    - key: art-of-data-hello-world-global-page
      resource: main
      resolver:
        function: resolver-function
      render: native
      title: Agile Pulse Analytics
      layout: basic
  jira:projectPage:
    - key: agile-pulse-project-page
      resource: main
      resolver:
        function: resolver-function
      render: native
      title: Agile Insights
      layout: basic
  function:
    - key: resolver-function
      handler: resolvers/index.handler

resources:
  - key: main
    path: src/frontend/index.jsx

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/c7778a47-43b6-466d-b8c6-3142f3d79fa9

permissions:
  scopes:
    - 'read:jira-work'
    - 'read:jira-user'